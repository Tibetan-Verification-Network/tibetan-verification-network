[project]
name = "tvn-backend"
version = "0.1.0"
description = "Tibetan Verification Network API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "boto3>=1.35.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.0",
  "markdown-it-py>=4.2.0",
  "nh3>=0.3.7",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn>=0.32.0",
]

[project.scripts]
tvn-api = "app.main:run"
tvn-bootstrap-admin = "app.cli.bootstrap:main"
tvn-rebuild-public-index = "app.cli.rebuild_public_index:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [".", "app", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.uv]
package = true
