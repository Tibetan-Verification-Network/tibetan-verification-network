name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Lint and typecheck
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy

  backend-test:
    name: Backend migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tvn
          POSTGRES_PASSWORD: tvn_local_dev
          POSTGRES_DB: tvn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvn -d tvn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
    env:
      TVN_ENV_FILE: ""
      ENVIRONMENT: test
      LOG_LEVEL: warning
      DATABASE_URL: postgresql://tvn:tvn_local_dev@127.0.0.1:5432/tvn
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      STORAGE_BUCKET: tvn-archive
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Start MinIO
        run: |
          docker run -d --name tvn-minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs tvn-minio >&2 || true
          exit 1
      - name: Migrate empty database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host pgsty/minio:RELEASE.2026-08-04T00-00-00Z \
            /bin/sh -c "mc alias set ci http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing ci/tvn-archive"
      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend-check:
    name: Frontend lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint, types, format, and test
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm run format:check && npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build && node scripts/verify-dist.mjs

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend-test, frontend-check]
    env:
      TVN_ENV_FILE: ""
      ENVIRONMENT: development
      LOG_LEVEL: warning
      DATABASE_URL: postgresql://tvn:tvn_local_dev@127.0.0.1:5432/tvn
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      STORAGE_BUCKET: tvn-archive
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_REGION: us-east-1
      VITE_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Start database and storage
        run: docker compose up -d --wait postgres minio
      - name: Migrate and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_e2e.py
      - name: Start API and frontend
        run: docker compose up -d --build --wait api frontend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200
