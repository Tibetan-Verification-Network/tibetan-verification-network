# Local PostgreSQL, API, and frontend. Defaults match .env.example.
# Published ports are fixed and bound to loopback: 5432, 8000, and 5173.
name: tvn

services:
  postgres:
    image: postgres:17-alpine
    container_name: tvn-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tvn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tvn_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tvn}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tvn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tvn} -d ${POSTGRES_DB:-tvn}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    init: true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tvn-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-tvn}:${POSTGRES_PASSWORD:-tvn_local_dev}@postgres:5432/${POSTGRES_DB:-tvn}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-tvn-archive}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      TVN_ENV_FILE: ""
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true

  minio:
    # Upstream minio/* images were removed from Docker Hub; pgsty/minio is API-compatible.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: tvn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - tvn-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    init: true

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: tvn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-minioadmin} ${STORAGE_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${STORAGE_BUCKET:-tvn-archive};
      exit 0;
      "
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tvn-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true

volumes:
  tvn-postgres-data:
    name: tvn-postgres-data
  tvn-minio-data:
    name: tvn-minio-data
